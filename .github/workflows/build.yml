name: Build
on:
  push:
    branches: ['master']
    paths:
      - 'flake.lock'
      - '.github/workflows/build.yml'
jobs:
  build-apple-system:
    runs-on: macos-14
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Install Lix
        uses: canidae-solutions/lix-quick-install-action@v5
        with:
          lix_conf: |
            experimental-features = nix-command flakes flake-self-attrs
            keep-env-derivations = true
            keep-outputs = true
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      - name: Configure external cache uploads
        uses: Mic92/niks3-action@v1
        with:
          server-url: https://niks3-cache.kempkens.network
      - name: Prepare Build
        run: rm -rf private .gitmodules .git/modules/private && sed -i .bak1 '/self.submodules = true;/d' flake.nix && sed -i .bak2 '/.\/private\/modules/d' flake.nix
      - name: Build Pallas
        run: nix build '.#darwinConfigurations.Pallas.config.system.build.toplevel'

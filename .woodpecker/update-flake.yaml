when:
  - event: manual
clone:
  labels:
    type: nix
  git:
    image: bash
    settings:
      recursive: true
      submodule_override:
        private: https://git.kempkens.io/daniel/dotfiles-private.git
steps:
  - name: update
    image: bash
    commands:
      - nix run '.#write-flake'
    labels:
      type: nix

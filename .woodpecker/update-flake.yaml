when:
  - event: manual
labels:
  type: podman
clone:
  git:
    image: quay.io/woodpeckerci/plugin-git
    settings:
      recursive: true
      submodule_override:
        private: https://git.kempkens.io/daniel/dotfiles-private.git
steps:
  - name: update
    image: ghcr.io/lix-project/lix:latest
    commands:
      - echo 'experimental-features = nix-command flakes' >> /etc/nix/nix.conf
      - nix run '.#write-flake'
